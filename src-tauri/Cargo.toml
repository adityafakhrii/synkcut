[package]
name = "synkcut"
version = "2.3.0"
description = "Synkcut — AI Desktop Video Editor (Suara, footage, dan motion otomatis sinkron)"
authors = ["Aditya Fakhri"]
edition = "2021"

[lib]
name = "synkcut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["fs", "process", "rt-multi-thread"] }
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "gzip", "deflate", "brotli"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.dev]
debug = 0

[profile.release]
strip = true
